<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow">
  <meta name="description" content="Read our latest blog posts and lifestyle articles in Karachi.">
  <title>Blog | Karachi Fun Escort</title>

  <link rel="canonical" href="https://www.karachifunescorts.online/blog">

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="fav.jpg">
  <link rel="apple-touch-icon" href="fav.jpg">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    :root {
      --bg-cream: #FAF6F0;
      --bg-soft-cream: #F3ECE1;
      --bg-dark-espresso: #3E2A24;
      --gold-primary: #C5A059;
      --gold-hover: #B08D46;
      --text-dark: #221814;
      --text-muted: #7A6E67;
      --card-white: #FFFFFF;
      --whatsapp-green: #25D366;
      --border-subtle: #EAE1D4;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--text-dark);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    h1, h2, h3 {
      font-family: Georgia, serif;
      font-weight: 600;
      color: var(--text-dark);
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .container {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* HEADER */
    header {
      background-color: rgba(250, 246, 240, 0.96);
      padding: 16px 0;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--text-dark);
    }

    .logo span {
      color: var(--gold-primary);
      font-style: italic;
    }

    .nav-links {
      display: flex;
      gap: 24px;
      list-style: none;
    }

    .nav-links a {
      font-size: 0.88rem;
      font-weight: 500;
    }

    .nav-links a.active, .nav-links a:hover {
      color: var(--gold-primary);
    }

    .btn-gold {
      background-color: var(--gold-primary);
      color: #FFF;
      padding: 10px 22px;
      border-radius: 25px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* BLOG SECTION */
    .blog-wrapper {
      padding: 50px 0 80px;
      flex-grow: 1;
    }

    .section-title {
      text-align: center;
      margin-bottom: 40px;
    }

    .section-title h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .section-title p {
      color: var(--text-muted);
    }

    .blog-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 26px;
    }

    .blog-card {
      background: var(--card-white);
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--border-subtle);
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .blog-card:hover {
      transform: translateY(-5px);
    }

    .blog-img-wrapper {
      height: 200px;
      width: 100%;
      background: #EAE1D4;
    }

    .blog-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .blog-content {
      padding: 22px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .blog-date {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .blog-content h3 {
      font-size: 1.3rem;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .blog-content p {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      flex-grow: 1;
    }

    .read-btn {
      color: var(--gold-primary);
      font-weight: 600;
      font-size: 0.85rem;
    }

    .no-blogs-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      background: var(--card-white);
      border-radius: 14px;
      border: 1px dashed var(--border-subtle);
      color: var(--text-muted);
    }

    /* FOOTER */
    footer {
      background-color: var(--bg-dark-espresso);
      color: #FFF;
      padding: 40px 0 20px;
      text-align: center;
      font-size: 0.85rem;
    }

    @media (max-width: 992px) {
      .blog-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 600px) {
      .blog-grid { grid-template-columns: 1fr; }
      .nav-links { display: none; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="container">
      <nav>
        <a href="/" class="logo">Karachi Fun <span>Escort</span></a>
        <ul class="nav-links">
          <li><a href="/">Home</a></li>
          <li><a href="/services">Services</a></li>
          <li><a href="/packages">Packages</a></li>
          <li><a href="/locations">Locations</a></li>
          <li><a href="/about">About</a></li>
          <li><a href="/blog" class="active">Blog</a></li>
          <li><a href="/contact">Contact</a></li>
        </ul>
        <a href="https://wa.me/923350246669" target="_blank" class="btn-gold">Book Now</a>
      </nav>
    </div>
  </header>

  <!-- BLOG CONTAINER -->
  <main class="blog-wrapper">
    <div class="container">
      <div class="section-title">
        <h1>Latest Articles & Guides</h1>
        <p>Explore our recent stories, tips, and updates.</p>
      </div>

      <div class="blog-grid" id="blogGrid">
        <!-- Javascript automatically loads blogs here -->
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="container">
      <p>&copy; 2026 Karachi Fun Escorts. All rights reserved.</p>
    </div>
  </footer>

  <!-- SCRIPT -->
  <script>
    const myBlogList = [
  {
    title: "Ultimate Guide to Luxury Companionship in Karachi",
    desc: "Explore top hotel outcall tips, dining etiquette, and discreet companionship in DHA and Clifton.",
    date: "September 1, 2026",
    img: "https://i.postimg.cc/zv80jfwG/hero.jpg",
    link: "karachi-luxury-guide.html"
  }
];
    // 👇 YAHAN AAP APNE NAYE BLOGS ADD KAREIN GAY 👇
    const myBlogList = [
      /* 
      Example format jab aapko naya blog show karna ho:
      {
        title: "Top 5 Places in Clifton Karachi",
        desc: "Read our full guide about best spots in Clifton...",
        date: "September 1, 2026",
        img: "https://i.postimg.cc/zv80jfwG/hero.jpg",
        link: "karachi-clifton-blog.html" 
      },
      */
    ];

    function loadBlogs() {
      const grid = document.getElementById('blogGrid');
      
      if (myBlogList.length === 0) {
        grid.innerHTML = `
          <div class="no-blogs-msg">
            <h3>No articles published yet</h3>
            <p>Naye blogs create karke list mein add karein, woh automatically yahan display ho jayenge.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = myBlogList.map(item => `
        <div class="blog-card">
          <div class="blog-img-wrapper">
            <img src="${item.img}" alt="${item.title}">
          </div>
          <div class="blog-content">
            <span class="blog-date">${item.date}</span>
            <h3>${item.title}</h3>
            <p>${item.desc}</p>
            <a href="${item.link}" class="read-btn">Read Article &rarr;</a>
          </div>
        </div>
      `).join('');
    }

    document.addEventListener("DOMContentLoaded", loadBlogs);
  </script>
</body>
</html>
